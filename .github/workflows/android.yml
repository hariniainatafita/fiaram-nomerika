name: Build Android APK (manual)

on:
  workflow_dispatch:

# Shares the keystore cache with the release workflow, so serializing them
# avoids generating two different signing keys on a cache miss.
concurrency:
  group: fiaram-android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check app version consistency
        run: node scripts/check-version.mjs

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROXY_URL: ${{ secrets.VITE_SUPABASE_PROXY_URL }}

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The keystore must exist before the cache save step so a first run with
      # an empty cache still saves a usable key. The cache is immutable, so v3
      # replaces the old v2 entry that failed to save with the deprecated
      # `save-always` option.
      - name: Restore signing keystore
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v3
          restore-keys: android-debug-keystore-v3

      - name: Ensure signing keystore exists
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Save signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v3

      - name: Report keystore cache
        run: |
          echo "::notice::Keystore cache hit: ${{ steps.keystore-cache.outputs.cache-hit }}"

      - name: Show signing certificate
        run: |
          fingerprint=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//')
          echo "::notice::Keystore signing certificate ${fingerprint}"

      # Ubuntu runners already ship the Android SDK ($ANDROID_HOME); just
      # accept the licenses before Gradle compiles the app.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Build release APK (GitHub flavor)
        run: |
          cd android
          bash ./gradlew assembleGithubRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          apk=android/app/build/outputs/apk/github/release/app-github-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          signature=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256')
          echo "::notice::APK signing certificate ${signature}"

      - uses: actions/upload-artifact@v4
        with:
          name: fiaram-nomerika-release-apk
          path: android/app/build/outputs/apk/github/release/app-github-release.apk
