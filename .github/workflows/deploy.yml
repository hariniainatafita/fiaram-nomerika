name: Build and publish Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# CI builds the APK with the same cached debug keystore and publishes it as a
# GitHub Release and on the Pages site (cloudflare/wrangler-action@v3 uses
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets).
concurrency:
  group: pronumtld-android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check app version consistency
        run: node scripts/check-version.mjs

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROXY_URL: ${{ secrets.VITE_SUPABASE_PROXY_URL }}

      - name: Copy web assets into the Android project
        run: npx cap sync android

      # Le zip OTA est généré après la copie dans l'APK : il n'alourdit donc
      # pas l'application et sert uniquement aux mises à jour web.
      - name: Build OTA web bundle
        run: npm run build:bundle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The keystore must exist before the cache save step so a first run with
      # an empty cache still saves a usable key. The cache is immutable, so v3
      # replaces the old v2 entry that failed to save with the deprecated
      # `save-always` option.
      - name: Restore signing keystore
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v3
          restore-keys: android-debug-keystore-v3

      - name: Ensure signing keystore exists
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Save as a normal step (not a post-step cache action) so the keystore is
      # persisted even when a later deploy step fails. This is the key fix for
      # the unstable APK signature.
      - name: Save signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v3

      - name: Report keystore cache
        run: |
          echo "::notice::Keystore cache hit: ${{ steps.keystore-cache.outputs.cache-hit }}"

      - name: Show signing certificate
        run: |
          fingerprint=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//')
          echo "::notice::Keystore signing certificate ${fingerprint}"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Build Android release APK (GitHub flavor)
        run: |
          cd android
          bash ./gradlew assembleGithubRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          apk=android/app/build/outputs/apk/github/release/app-github-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          signature=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256')
          echo "::notice::APK signing certificate ${signature}"

      - name: Prepare release assets
        run: |
          apk=android/app/build/outputs/apk/github/release/app-github-release.apk
          mkdir -p release-assets dist/downloads
          cp "$apk" release-assets/app-release.apk
          # Keep the old asset name so installs that still check app-debug.apk
          # receive this release build instead of a 404.
          cp "$apk" release-assets/app-debug.apk
          cp "$apk" dist/downloads/Pro-Num-TLD-latest.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.repository.name }}-${{ github.sha }}
          name: Pro-Num-TLD ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Verify Cloudflare Pages access
        id: cf
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the GitHub repository secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set in the GitHub repository secrets."
            exit 1
          fi
          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pro-num-tld")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cloudflare Pages API rejected the token or project (HTTP ${http_code}): ${body}"
            exit 1
          fi
          branch=$(echo "$body" | jq -r '.result.production_branch // "master"')
          echo "Production branch: ${branch}"
          echo "production_branch=${branch}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pages Functions are deployed with the site. The `MEDIA` binding points
      # at the R2 bucket `pro-num-tld-media`; that bucket must exist in the
      # account or Wrangler refuses to publish the Functions bundle.
      - name: Deploy
        run: |
          set +e
          output=$(npx --yes wrangler@4 pages deploy dist --project-name pro-num-tld --branch "${{ steps.cf.outputs.production_branch }}" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            message=$(echo "$output" | tr '\n' ' ')
            echo "::error::Cloudflare Pages deploy failed (${status}): ${message}"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
