name: Build and publish Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# CI builds the APK with the same cached debug keystore and publishes it as a
# GitHub Release and on the Pages site (cloudflare/wrangler-action@v3 uses
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets).
concurrency:
  group: fiaram-android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check app version consistency
        run: node scripts/check-version.mjs

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Reuse the same debug keystore across runs, otherwise every APK is
      # signed with a different key and Android refuses the in-app update.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: android-debug-keystore-v1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Build Android APK
        run: |
          cd android
          bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.repository.name }}-${{ github.sha }}
          name: FIARAM ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Publish APK with the site
        run: |
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/downloads/FIARAM-NOMERIKA-latest.apk

      - name: Verify Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the GitHub repository secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set in the GitHub repository secrets."
            exit 1
          fi
          npx --yes wrangler@4 whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pages Functions are deployed with the site. The R2 bucket is referenced
      # by the `MEDIA` binding configured on the Pages project; when it is
      # absent the upload endpoint answers 5xx and the app falls back to
      # Supabase Storage, so a missing binding never blocks a deployment.
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name fiaram-nomerika --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
