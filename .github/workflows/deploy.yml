name: Build and publish Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# CI builds the APK with the same cached debug keystore and publishes it as a
# GitHub Release and on the Pages site (cloudflare/wrangler-action@v3 uses
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets).
concurrency:
  group: fiaram-android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check app version consistency
        run: node scripts/check-version.mjs

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The keystore must exist before the cache post-step so a first run with
      # an empty cache still saves a usable key. The cache is immutable, so v2
      # replaces the old empty v1 entry that made every run generate a new key.
      - name: Ensure signing keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v2
          restore-keys: android-debug-keystore-v2

      - name: Report keystore cache
        run: echo "::notice::Keystore cache hit: ${{ steps.keystore-cache.outputs.cache-hit }}"

      - name: Show signing certificate
        run: |
          fingerprint=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//')
          echo "::notice::Keystore signing certificate ${fingerprint}"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Build Android release APK
        run: |
          cd android
          bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          signature=$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256')
          echo "::notice::APK signing certificate ${signature}"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets dist/downloads
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/app-release.apk
          # Keep the old asset name so installs that still check app-debug.apk
          # receive this release build instead of a 404.
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/app-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/downloads/FIARAM-NOMERIKA-latest.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.repository.name }}-${{ github.sha }}
          name: FIARAM ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Verify Cloudflare Pages access
        id: cf
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the GitHub repository secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set in the GitHub repository secrets."
            exit 1
          fi
          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/fiaram-nomerika")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cloudflare Pages API rejected the token or project (HTTP ${http_code}): ${body}"
            exit 1
          fi
          branch=$(echo "$body" | jq -r '.result.production_branch // "master"')
          echo "Production branch: ${branch}"
          echo "production_branch=${branch}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pages Functions are deployed with the site. The R2 bucket is referenced
      # by the `MEDIA` binding configured on the Pages project; when it is
      # absent the upload endpoint answers 5xx and the app falls back to
      # Supabase Storage, so a missing binding never blocks a deployment.
      - name: Deploy
        run: |
          set +e
          output=$(npx --yes wrangler@4 pages deploy dist --project-name fiaram-nomerika --branch "${{ steps.cf.outputs.production_branch }}" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            message=$(echo "$output" | tr '\n' ' ')
            echo "::error::Cloudflare Pages deploy failed (${status}): ${message}"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
