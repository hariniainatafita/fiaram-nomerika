name: Release Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# CI builds the APK with the same cached debug keystore and publishes it as a
# GitHub Release. Serializing with the manual APK workflow prevents a
# first-run race that would sign artifacts with different keys.
concurrency:
  group: fiaram-android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check app version consistency
        run: node scripts/check-version.mjs

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Reuse the same debug keystore across runs, otherwise every APK is
      # signed with a different key and Android refuses the in-app update.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: android-debug-keystore-v1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Build Android APK
        run: |
          cd android
          bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.repository.name }}-${{ github.sha }}
          name: FIARAM ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
