name: Redirect old GitHub Pages to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

      - name: Deploy redirect
        uses: actions/deploy-pages@v4
